<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071014">
  <title>Колыбель Титанов — Шпиль Обломков</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="game" aria-label="3D-игра Колыбель Титанов"></canvas>
    <section class="hud" aria-live="polite">
      <div class="hud-top">
        <div class="zone-card">
          <div class="eyebrow">КОЛЫБЕЛЬ ТИТАНОВ</div>
          <div class="zone-title">ШПИЛЬ ОБЛОМКОВ</div>
          <div id="objective" class="objective">Доберись до святилища Эхо-Лука.</div>
        </div>
        <div class="status-card">
          <div class="status-row"><span>ЦЕЛОСТНОСТЬ</span><strong id="hpText">100 / 100</strong></div>
          <div class="bar"><div id="hpBar" class="bar-fill"></div></div>
          <div id="abilityText" class="abilities">Mantle · Wall Jump</div>
        </div>
      </div>
      <div id="bossHud" class="boss-card hidden">
        <div class="status-row"><span>СТРАЖ КОРНЕЙ</span><strong id="bossState">Резонансные узлы: 3</strong></div>
        <div class="bar boss"><div id="bossBar" class="bar-fill"></div></div>
      </div>
      <div class="controls">WASD движение · Shift спринт · Space прыжок · ЛКМ клинок · ПКМ Эхо-Лук · Q цель · E крюк</div>
      <button id="startButton" class="start-button" type="button">Начать исследование</button>
      <div id="message" class="message hidden"></div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
