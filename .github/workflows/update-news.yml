name: Update PayDigest news
run-name: Обновление PayDigest · ${{ github.actor }}

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Сразу опубликовать обновлённый выпуск
        required: true
        default: true
        type: boolean
  push:
    branches:
      - claude/mario-maker-style-game-7p670u
    paths:
      - .github/workflows/update-news.yml

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: paydigest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать опубликованную версию
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Подготовить Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Проверить сценарий
        run: node payments-news/scripts/update-news.mjs --self-test

      - name: Собрать и проанализировать материалы
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node payments-news/scripts/update-news.mjs

      - name: Проверить выпуск
        run: |
          node --check payments-news/data.js
          node --check payments-news/app.js
          node payments-news/scripts/audit-site.mjs
          test -s payments-news/index.html

      - name: Сохранить выпуск
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payments-news/data.js payments-news/index.html
          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update PayDigest materials"
            git push origin HEAD:gh-pages
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Настроить GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Собрать публикацию
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        run: |
          tar --dereference --hard-dereference \
            --directory . \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Загрузить публикацию
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Опубликовать сайт
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
