name: Deploy Prosyolok and PayDigest

on:
  push:
    branches:
      - claude/mario-maker-style-game-7p670u
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v4
        with:
          ref: claude/mario-maker-style-game-7p670u
          fetch-depth: 0

      - name: Add PayDigest from publishing branch
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git checkout origin/gh-pages -- payments-news
          test -f payments-news/index.html
          test -f payments-news/styles.css
          test -f payments-news/app.js
          test -f payments-news/data.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Static analysis
        run: npm run check

      - name: Unit and contract tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Validate PayDigest JavaScript
        run: |
          node --check payments-news/app.js
          node --check payments-news/data.js

      - name: Assemble and verify publication
        run: |
          cp -R payments-news dist/payments-news
          test -f dist/index.html
          test -f dist/src/game.js
          test -f dist/src/physics.js
          test -f dist/src/renderer.js
          test -f dist/manifest.webmanifest
          test -f dist/payments-news/index.html
          test $(du -sk dist | cut -f1) -lt 2048

      - name: Preserve production build
        uses: actions/upload-artifact@v4
        with:
          name: prosyolok-production
          path: dist
          if-no-files-found: error

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
