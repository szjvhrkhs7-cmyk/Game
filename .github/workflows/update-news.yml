name: Update PayDigest news
run-name: Обновление PayDigest · ${{ github.actor }}

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Сразу опубликовать обновлённый выпуск
        required: true
        default: true
        type: boolean
  push:
    branches:
      - claude/mario-maker-style-game-7p670u
    paths:
      - .github/workflows/update-news.yml

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: paydigest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать опубликованную версию
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить сценарий
        run: node payments-news/scripts/update-news.mjs --self-test

      - name: Собрать и проанализировать материалы
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node payments-news/scripts/update-news.mjs

      - name: Проверить выпуск
        run: |
          node --check payments-news/data.js
          node --check payments-news/app.js
          test -s payments-news/index.html

      - name: Сохранить выпуск
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payments-news/data.js payments-news/index.html
          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update PayDigest materials"
            git push origin HEAD:gh-pages
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Настроить GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: actions/configure-pages@v5

      - name: Собрать публикацию
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      - name: Опубликовать сайт
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
